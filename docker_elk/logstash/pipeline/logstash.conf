input {
    beats {
        port => 5044
        host => "0.0.0.0"
  }
}

filter {
  # Простой grok для извлечения основных полей
  grok {
    match => {
      "message" => "(?<log_timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) (?<log_level>\w+) (?<logger>[\w\.]+) - (?<log_message>.*)"
    }
  }

  # Преобразование даты
  if [log_timestamp] {
    date {
      match => [ "log_timestamp", "yyyy-MM-dd HH:mm:ss" ]
      target => "parsed_timestamp"
      timezone => "UTC"
    }
  }

  # Нормализация уровня лога
  if [log_level] {
    mutate {
      lowercase => [ "log_level" ]
    }
  }
}

output {
  elasticsearch {
    hosts => "elasticsearch:9200"
    user => elastic
    password => elastic
    index => "%{[@metadata][version]}-%{+YYYY.MM.dd}"
  }
}