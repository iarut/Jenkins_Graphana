version: '3.8'

services:
  jenkins:
    build:
      dockerfile: Dockerfile
      context: .
    restart: always
    privileged: true
    user: root
    ports:
      - 9696:8080
      - 50000:50000
    container_name: jenkins
    volumes:
      #      - /Users/sushantkumar/Desktop/blog/jenkins/jenkins_configuration:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins_home:/var/jenkins_home
    networks:
      monitoring:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - 9090:9090
    networks:
      monitoring:


  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      monitoring:

  influxdb:
    image: influxdb:latest
    container_name: influxdb
    ports:
      - 8086:8086
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: myuser
      DOCKER_INFLUXDB_INIT_PASSWORD: mypassword
      DOCKER_INFLUXDB_INIT_ORG: myorg
      DOCKER_INFLUXDB_INIT_BUCKET: mybucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: mytoken
    networks:
      monitoring:

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - 9100:9100
    networks:
      monitoring:

  elasticsearch:
    build:
      context: docker_elk/elasticsearch
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      ES_JAVA_OPTS: "-Xmx256m -Xms256m"
      ELASTIC_PASSWORD: elastic
      discovery.type: single-node
    networks:
      - monitoring

  logstash:
    build:
      context: docker_elk/logstash
    ports:
      - "5044:5044"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - ./docker_elk/logstash/pipeline:/usr/share/logstash/pipeline:ro  # ← Важно!
    networks:
      - monitoring
    depends_on:
      - elasticsearch
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9600/_node/pipelines || exit 1" ]
      interval: 10s
      retries: 10

  kibana:
    build:
      context: docker_elk/kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      ELASTICSEARCH_USERNAME: "elastic"
      ELASTICSEARCH_PASSWORD: "elastic"
    networks:
      - monitoring
    depends_on:
      - elasticsearch


  filebeat:
    depends_on:
      logstash:
        condition: service_healthy
    build:
      context: docker_elk
      dockerfile: Dockerfile
    container_name: filebeat
    user: root
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/app_logs:ro
    networks:
      - monitoring


  app:
    build:
      context: .
      dockerfile: Dockerfile_app
    container_name: spring-boot-app
    ports:
      - 8081:8081
    volumes:
      - ./logs:/app/logs:rw
    depends_on:
      - jenkins
    networks:
      monitoring:



networks:
    monitoring:
      driver: bridge


volumes:
  prometheus_data:
  grafana_data:
  influxdb_data:
  jenkins_home:
  elasticsearch_data:
